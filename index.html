let fcState = { book:'alifbaa', unit:'all', type:'all', status:'all', deck:[], idx:0, flipped:false, dir:'ar2en' };
const WORD_TYPES = ["noun","verb","adjective","pronoun","question","number","particle","phrase"];
const WORD_TYPE_LABELS = { noun:"Nouns", verb:"Verbs", adjective:"Adjectives", pronoun:"Pronouns", question:"Question words", number:"Numbers", particle:"Particles", phrase:"Phrases" };
let knownWords = loadProgress('knownWords', {});
function vocabKey(v){ return v.book+'|'+v.en+'|'+v.ar; }
function isKnown(v){ return !!knownWords[vocabKey(v)]; }
function setKnown(v, known){
  const key = vocabKey(v);
  if(known) knownWords[key]=true; else delete knownWords[key];
  saveProgress('knownWords', knownWords);
}
function renderFlashcards(main){
  buildDeck();
  main.appendChild(mkEl(`<div><h1>Flashcards</h1></div>`));
  const controls = mkEl(`
    <div class="row" style="margin-bottom:16px;">
      <select id="fcBook"></select>
      <select id="fcUnit"></select>
      <select id="fcType"></select>
      <select id="fcStatus"></select>
      <select id="fcDir">
        <option value="ar2en">Arabic → English</option>
        <option value="en2ar">English → Arabic</option>
      </select>
      <button class="btn ghost" id="fcShuffle">Shuffle</button>
      <span class="pill" id="fcKnownCount"></span>
    </div>
  `);
  main.appendChild(controls);
  const bookSel = controls.querySelector('#fcBook');
  BOOKS.forEach(b=>bookSel.appendChild(mkEl(`<option value="${b.id}">${b.label}</option>`)));
  bookSel.value = fcState.book;
  bookSel.onchange=()=>{ fcState.book=bookSel.value; fcState.unit='all'; populateUnitOptions(); buildDeck(); fcState.idx=0; fcState.flipped=false; renderCardArea(); };
  const unitSel = controls.querySelector('#fcUnit');
  function populateUnitOptions(){
    const b = BOOKS.find(x=>x.id===fcState.book);
    unitSel.innerHTML='';
    unitSel.appendChild(mkEl(`<option value="all">All ${b.unitLabel.toLowerCase()}s</option>`));
    for(let u=1; u<=b.unitCount; u++) unitSel.appendChild(mkEl(`<option value="${u}">${b.unitLabel} ${u}</option>`));
    unitSel.value = fcState.unit;
  }
  populateUnitOptions();
  unitSel.onchange=()=>{ fcState.unit=unitSel.value; buildDeck(); fcState.idx=0; fcState.flipped=false; renderCardArea(); };
  const typeSel = controls.querySelector('#fcType');
  typeSel.appendChild(mkEl(`<option value="all">All word types</option>`));
  WORD_TYPES.forEach(t=>typeSel.appendChild(mkEl(`<option value="${t}">${WORD_TYPE_LABELS[t]}</option>`)));
  typeSel.value = fcState.type;
  typeSel.onchange=()=>{ fcState.type=typeSel.value; buildDeck(); fcState.idx=0; fcState.flipped=false; renderCardArea(); };
  const statusSel = controls.querySelector('#fcStatus');
  statusSel.appendChild(mkEl(`<option value="all">All cards</option>`));
  statusSel.appendChild(mkEl(`<option value="known">Known</option>`));
  statusSel.appendChild(mkEl(`<option value="unknown">Still learning</option>`));
  statusSel.value = fcState.status;
  statusSel.onchange=()=>{ fcState.status=statusSel.value; buildDeck(); fcState.idx=0; fcState.flipped=false; renderCardArea(); };
  const dirSel = controls.querySelector('#fcDir');
  dirSel.value = fcState.dir;
  dirSel.onchange=()=>{ fcState.dir=dirSel.value; fcState.flipped=false; renderCardArea(); };
  controls.querySelector('#fcShuffle').onclick=()=>{ fcState.deck=shuffle(fcState.deck); fcState.idx=0; fcState.flipped=false; renderCardArea(); };

  const area = mkEl(`<div class="flash-wrap" id="fcArea"></div>`);
  main.appendChild(area);
  renderCardArea();

  function buildDeck(){
    fcState.deck = VOCAB.filter(v=>
      v.book===fcState.book &&
      (fcState.unit==='all' || v.unit===Number(fcState.unit)) &&
      (fcState.type==='all' || v.type===fcState.type) &&
      (fcState.status==='all' || (fcState.status==='known')===isKnown(v))
    );
  }
  function updateKnownCount(){
    const el = document.getElementById('fcKnownCount');
    const pool = VOCAB.filter(v=>v.book===fcState.book);
    if(el) el.textContent = `${pool.filter(isKnown).length}/${pool.length} known`;
  }
  function advanceAfterMark(){
    if(fcState.status!=='all'){
      buildDeck();
      if(fcState.idx>=fcState.deck.length) fcState.idx=0;
    } else {
      fcState.idx=(fcState.idx+1)%fcState.deck.length;
    }
    fcState.flipped=false;
    renderCardArea();
  }
  function renderCardArea(){
    updateKnownCount();
    const areaEl = document.getElementById('fcArea');
    if(!areaEl) return;
    areaEl.innerHTML='';
    if(fcState.deck.length===0){ areaEl.appendChild(mkEl(`<p class="muted">No cards.</p>`)); return; }
    const v = fcState.deck[fcState.idx];
    const bookInfo = BOOKS.find(b=>b.id===v.book);
    const showFront = fcState.dir==='ar2en' ? `<div class="arabic" style="font-size:34px;">${v.ar}</div><div class="translit">${v.tr}</div>` : `<div>${v.en}</div>`;
    const showBack = fcState.dir==='ar2en' ? `<div>${v.en}</div>` : `<div class="arabic" style="font-size:34px;">${v.ar}</div><div class="translit">${v.tr}</div>`;
    const knownTag = isKnown(v) ? ` · <span style="color:var(--good);">✓ known</span>` : '';
    const card = mkEl(`
      <div class="flashcard">
        <span class="tag">${bookInfo.label}, ${bookInfo.unitLabel} ${v.unit} · ${WORD_TYPE_LABELS[v.type]} · ${fcState.idx+1}/${fcState.deck.length}${knownTag}</span>
        <div id="fcContent">${fcState.flipped?showBack:showFront}</div>
        <span class="hint">click to flip</span>
      </div>
    `);
    card.onclick=()=>{ fcState.flipped=!fcState.flipped; renderCardArea(); };
    areaEl.appendChild(card);
    const knowRow = mkEl(`
      <div class="row">
        <button class="btn ghost" id="fcStillLearning" style="border-color:var(--bad);color:var(--bad);">Still learning</button>
        <button class="btn ghost" id="fcKnowIt" style="border-color:var(--good);color:var(--good);">✓ I know this</button>
      </div>
    `);
    areaEl.appendChild(knowRow);
    knowRow.querySelector('#fcKnowIt').onclick=()=>{ setKnown(v, true); advanceAfterMark(); };
    knowRow.querySelector('#fcStillLearning').onclick=()=>{ setKnown(v, false); advanceAfterMark(); };
    const nav = mkEl(`
      <div class="row">
        <button class="btn ghost" id="fcPrev">&larr; Prev</button>
        <button class="btn" id="fcNext">Next &rarr;</button>
      </div>
    `);
    areaEl.appendChild(nav);
    nav.querySelector('#fcPrev').onclick=()=>{ fcState.idx=(fcState.idx-1+fcState.deck.length)%fcState.deck.length; fcState.flipped=false; renderCardArea(); };
    nav.querySelector('#fcNext').onclick=()=>{ fcState.idx=(fcState.idx+1)%fcState.deck.length; fcState.flipped=false; renderCardArea(); };
  }
}

let matchState = { pairs:[], selectedLeft:null, selectedRight:null, matched:0, mistakes:0, leftOrder:[], rightOrder:[] };
let matchBook = 'alifbaa';
function renderMatching(main){
  main.appendChild(mkEl(`<div><h1>Matching Game</h1></div>`));
  const stats = mkEl(`<div class="row" style="margin-bottom:10px;"><select id="mBook"></select><span class="pill" id="mStats"></span><button class="btn ghost" id="mNew">New round</button></div>`);
  main.appendChild(stats);
  const bookSel = stats.querySelector('#mBook');
  BOOKS.forEach(b=>bookSel.appendChild(mkEl(`<option value="${b.id}">${b.label}</option>`)));
  bookSel.value = matchBook;
  bookSel.onchange=()=>{ matchBook=bookSel.value; newRound(); };
  const gridWrap = mkEl(`<div class="match-grid" id="mGrid"></div>`);
  main.appendChild(gridWrap);
  stats.querySelector('#mNew').onclick=newRound;
  newRound();

  function newRound(){
    matchState.pairs = sample(VOCAB.filter(v=>v.book===matchBook), 8);
    matchState.selectedLeft=null; matchState.selectedRight=null; matchState.matched=0; matchState.mistakes=0;
    matchState.leftOrder = shuffle(matchState.pairs.map((p,i)=>i));
    matchState.rightOrder = shuffle(matchState.pairs.map((p,i)=>i));
    draw();
  }
  function draw(){
    document.getElementById('mStats').textContent = `Matched ${matchState.matched}/${matchState.pairs.length} \u00b7 Mistakes: ${matchState.mistakes}`;
    const g = document.getElementById('mGrid');
    g.innerHTML='';
    const leftCol = mkEl(`<div class="match-col"></div>`);
    const rightCol = mkEl(`<div class="match-col"></div>`);
    matchState.leftOrder.forEach(i=>{
      const p = matchState.pairs[i];
      const t = mkEl(`<div class="tile arabic" data-i="${i}">${p.ar}</div>`);
      if(p._done) t.classList.add('correct','locked');
      t.onclick=()=>selectLeft(i,t);
      leftCol.appendChild(t);
    });
    matchState.rightOrder.forEach(i=>{
      const p = matchState.pairs[i];
      const t = mkEl(`<div class="tile" data-i="${i}">${p.en}</div>`);
      if(p._done) t.classList.add('correct','locked');
      t.onclick=()=>selectRight(i,t);
      rightCol.appendChild(t);
    });
    g.appendChild(leftCol); g.appendChild(rightCol);
  }
  function selectLeft(i,elm){
    if(matchState.pairs[i]._done) return;
    document.querySelectorAll('.match-col:first-child .tile').forEach(t=>t.classList.remove('selected'));
    elm.classList.add('selected');
    matchState.selectedLeft=i;
    tryMatch();
  }
  function selectRight(i,elm){
    if(matchState.pairs[i]._done) return;
    document.querySelectorAll('.match-col:last-child .tile').forEach(t=>t.classList.remove('selected'));
    elm.classList.add('selected');
    matchState.selectedRight=i;
    tryMatch();
  }
  function tryMatch(){
    if(matchState.selectedLeft===null || matchState.selectedRight===null) return;
    if(matchState.selectedLeft===matchState.selectedRight){
      matchState.pairs[matchState.selectedLeft]._done=true;
      matchState.matched++;
    } else {
      matchState.mistakes++;
    }
    matchState.selectedLeft=null; matchState.selectedRight=null;
    setTimeout(draw, 250);
  }
}

let quizState = {};
function startQuiz(main, cat){
  const catInfo = QUIZ_CATEGORIES.find(c=>c.id===cat);
  const questions = genQuestions(cat, 12);
  quizState = { cat, questions, idx:0, score:0, answered:false };
  const wrap = mkEl(`<div></div>`);
  wrap.appendChild(mkEl(`<div class="row" style="margin-bottom:10px;"><button class="btn ghost" id="qBack">&larr; Categories</button><div class="spacer"></div><span class="pill">${catInfo.label}</span></div>`));
  wrap.appendChild(mkEl(`<div class="progressbar"><div id="qProgress" style="width:0%"></div></div>`));
  wrap.appendChild(mkEl(`<div class="card" id="qCard"></div>`));
  main.appendChild(wrap);
  wrap.querySelector('#qBack').onclick=()=>go('quiz');
  renderQuestion();

  function renderQuestion(){
    const q = quizState.questions[quizState.idx];
    document.getElementById('qProgress').style.width = ((quizState.idx)/quizState.questions.length*100)+'%';
    const card = document.getElementById('qCard');
    card.innerHTML='';
    card.appendChild(mkEl(`<div class="quiz-prompt">${q.prompt}</div>`));
    const opts = mkEl(`<div class="quiz-options"></div>`);
    q.options.forEach((opt,i)=>{
      const b = mkEl(`<button class="qopt">${opt}</button>`);
      b.onclick=()=>answer(i,b);
      opts.appendChild(b);
    });
    card.appendChild(opts);
    const explain = mkEl(`<div id="qExplain"></div>`);
    card.appendChild(explain);
    const nav = mkEl(`<div class="row" style="margin-top:14px;"><span class="score-badge" id="qScore">Score: ${quizState.score}/${quizState.idx}</span><div class="spacer"></div><button class="btn" id="qNext" disabled>Next</button></div>`);
    card.appendChild(nav);
    nav.querySelector('#qNext').onclick=next;
  }
  function answer(i, btnEl){
    if(quizState.answered) return;
    quizState.answered=true;
    const q = quizState.questions[quizState.idx];
    const allBtns = document.querySelectorAll('.qopt');
    allBtns.forEach((b,bi)=>{
      b.disabled=true;
      if(bi===q.correct) b.classList.add('correct');
      else if(bi===i) b.classList.add('wrong');
    });
    if(i===q.correct) quizState.score++;
    if(q.explain) document.getElementById('qExplain').appendChild(mkEl(`<div class="explain">${q.explain}</div>`));
    document.getElementById('qScore').textContent = `Score: ${quizState.score}/${quizState.idx+1}`;
    document.getElementById('qNext').disabled=false;
  }
  function next(){
    quizState.idx++;
    quizState.answered=false;
    if(quizState.idx>=quizState.questions.length){ renderFinal(); return; }
    renderQuestion();
  }
  function renderFinal(){
    document.getElementById('qProgress').style.width='100%';
    const card = document.getElementById('qCard');
    const pct = Math.round(quizState.score/quizState.questions.length*100);
    card.innerHTML='';
    card.appendChild(mkEl(`
      <div style="text-align:center;padding:20px 0;">
        <h2 style="margin-top:0;">Quiz complete</h2>
        <p style="font-size:32px;font-weight:700;color:var(--accent);">${quizState.score} / ${quizState.questions.length}</p>
        <p class="muted">${pct}% correct</p>
        <div class="row" style="justify-content:center;margin-top:16px;">
          <button class="btn" id="qAgain">Try again</button>
          <button class="btn ghost" id="qMenu">Other categories</button>
        </div>
      </div>
    `));
    card.querySelector('#qAgain').onclick=()=>go('quiz', cat);
    card.querySelector('#qMenu').onclick=()=>go('quiz');
  }
}

function genQuestions(cat, n){
  if(cat==='vocab') return genVocabQuestions(n);
  if(cat==='gender') return genGenderQuestions(n);
  if(cat==='definite') return genDefiniteQuestions(n);
  if(cat==='case') return genCaseQuestions(n);
  if(cat==='sunmoon') return genSunMoonQuestions(n);
  if(cat==='pronoun') return genPronounQuestions(n);
  if(cat==='verb') return genVerbQuestions(n);
  if(cat==='qword') return genQWordQuestions(n);
  if(cat==='sentype') return genSentypeQuestions(n);
  if(cat==='plural') return genPluralQuestions(n);
  if(cat==='recognize') return genRecognitionQuestions(n);
  return [];
}

function mcqFrom(correctText, distractorPool, promptHtml, explain){
  const distractors = sample(distractorPool.filter(d=>d!==correctText), 3);
  const options = shuffle([correctText, ...distractors]);
  return { prompt: promptHtml, options, correct: options.indexOf(correctText), explain };
}

function genVocabQuestions(n){
  const qs=[];
  const allEn = VOCAB.map(v=>v.en);
  for(let i=0;i<n;i++){
    const v = pick(VOCAB);
    if(Math.random()<0.5){
      qs.push(mcqFrom(v.en, allEn, `What does <span class="arabic big-ar">${v.ar}</span> <span class="muted">(${v.tr})</span> mean?`, `${v.ar} = ${v.en}`));
    } else {
      const allArWithSameEn = mcqFrom(v.ar, VOCAB.map(x=>x.ar), `Which word means "${v.en}"?`, `${v.en} = ${v.ar} (${v.tr})`);
      allArWithSameEn.options = allArWithSameEn.options.map(o=>`<span class="arabic big-ar">${o}</span>`);
      allArWithSameEn.prompt = allArWithSameEn.prompt;
      qs.push(allArWithSameEn);
    }
  }
  return qs;
}
function genGenderQuestions(n){
  const qs=[]; const pool = shuffle(GENDER_BANK).slice(0, Math.min(n, GENDER_BANK.length));
  pool.forEach(g=>{
    const [ar,tr,en,gender]=g;
    const options = shuffle(['masculine','feminine']);
    qs.push({ prompt:`Is <span class="arabic big-ar">${ar}</span> <span class="muted">(${tr})</span> masculine or feminine?`, options, correct: options.indexOf(gender==='m'?'masculine':'feminine'),
      explain: (gender==='m' ? `${ar} is masculine. It doesn't end in \u0629.` : `${ar} is feminine.`) + ` (\u201c${en}\u201d)` });
  });
  while(qs.length<n) qs.push(qs[qs.length % pool.length]);
  return qs.slice(0,n);
}
function genDefiniteQuestions(n){
  const qs=[]; const pool = shuffle(DEFINITENESS_BANK).slice(0, Math.min(n, DEFINITENESS_BANK.length));
  pool.forEach(d=>{
    const [ar,tr,en,isDef,reason]=d;
    const options = shuffle(['Definite','Indefinite']);
    qs.push({ prompt:`<span class="arabic big-ar">${ar}</span><br><span class="muted">${tr}</span><br>Is this definite or indefinite?`, options, correct: options.indexOf(isDef?'Definite':'Indefinite'), explain: reason + ` (\u201c${en}\u201d)` });
  });
  while(qs.length<n) qs.push(qs[qs.length % pool.length]);
  return qs.slice(0,n);
}
function genCaseQuestions(n){
  const qs=[];
  const flat=[];
  CASE_BANK.forEach(s=>s.targets.forEach(t=>flat.push({sentence:s, target:t})));
  const pool = shuffle(flat).slice(0, Math.min(n, flat.length));
  pool.forEach(item=>{
    const options = shuffle(['nominative','accusative','genitive']);
    qs.push({
      prompt:`<span class="arabic big-ar">${item.sentence.ar}</span><br><span class="muted">${item.sentence.tr}</span><br>What case is <span class="arabic">${item.target.word}</span> in?`,
      options, correct: options.indexOf(item.target.case),
      explain: `${item.target.word} is ${item.target.case}: ${item.target.why}. (\u201c${item.sentence.en}\u201d)`
    });
  });
  while(qs.length<n) qs.push(qs[qs.length % pool.length]);
  return qs.slice(0,n);
}
function genSunMoonQuestions(n){
  const qs=[]; const pool = shuffle(ALPHABET).slice(0, Math.min(n, ALPHABET.length));
  pool.forEach(a=>{
    const options = shuffle(['Sun letter (\u0644 not pronounced)','Moon letter (\u0644 pronounced)']);
    const correctText = a.type==='sun' ? 'Sun letter (\u0644 not pronounced)' : 'Moon letter (\u0644 pronounced)';
    qs.push({ prompt:`If <span class="arabic big-ar">${a.iso}</span> (${a.name}) follows <span class="arabic">ال</span>, what happens to the \u0644?`, options, correct: options.indexOf(correctText),
      explain: a.type==='sun' ? `${a.name} is a sun letter, so the \u0644 assimilates and the letter doubles (gets a shadda).` : `${a.name} is a moon letter, so the \u0644 is pronounced normally.` });
  });
  while(qs.length<n) qs.push(qs[qs.length % pool.length]);
  return qs.slice(0,n);
}
function genPronounQuestions(n){
  const qs=[];
  for(let i=0;i<n;i++){
    const p = pick(PRONOUNS);
    if(Math.random()<0.5){
      qs.push(mcqFrom(p.meaning, PRONOUNS.map(x=>x.meaning), `What does the subject pronoun <span class="arabic big-ar">${p.subj}</span> mean?`, `${p.subj} = ${p.meaning}`));
    } else {
      qs.push(mcqFrom(p.meaning, PRONOUNS.map(x=>x.meaning), `The possessive suffix <span class="arabic big-ar">${p.suf}</span> (${p.sufTr}) attached to a noun means "... of whom"? Pick the matching person:`, `${p.suf} (${p.sufTr}) = ${p.meaning}, e.g. ${p.example}`));
    }
  }
  return qs;
}
function genVerbQuestions(n){
  const qs=[];
  for(let i=0;i<n;i++){
    const v = pick(CONJUGATIONS);
    const forms = v.forms;
    const pIdx = Math.floor(Math.random()*forms.length);
    const correct = forms[pIdx];
    const distractorPool = forms.filter((f,fi)=>fi!==pIdx);
    const distractors = sample(distractorPool, Math.min(3, distractorPool.length));
    while(distractors.length<3) distractors.push(pick(CONJUGATIONS.flatMap(x=>x.forms).filter(f=>f!==correct)));
    const options = shuffle([correct, ...distractors]);
    qs.push({
      prompt:`How do you say <span class="arabic big-ar">${CONJ_PRONOUNS[pIdx]}</span> with <span class="arabic big-ar">${v.root}</span> <span class="muted">(${v.english})</span>?`,
      options: options.map(o=>`<span class="arabic big-ar">${o}</span>`),
      correct: options.indexOf(correct),
      explain: `${CONJ_PERSON_LABELS[pIdx]} + ${v.english} = ${correct}`
    });
  }
  return qs;
}
function genQWordQuestions(n){
  const qs=[]; const pool=[];
  for(let i=0;i<n;i++){
    const q = pick(QWORDS);
    qs.push(mcqFrom(q[2], QWORDS.map(x=>x[2]), `What does <span class="arabic big-ar">${q[1]}</span> (${q[0]}) mean?`, `${q[1]} (${q[0]}) = ${q[2]}`));
  }
  return qs;
}

function genRecognitionQuestions(n){
  const qs=[];
  const wordItems=[];
  RECOGNITION_BANK.forEach(s=>s.targets.forEach(t=>wordItems.push({sentence:s, target:t})));
  const sentenceItems = RECOGNITION_BANK.filter(s=>s.sentenceType);
  for(let i=0;i<n;i++){
    if(sentenceItems.length===0 || Math.random()<0.7){
      const item = pick(wordItems);
      const distractors = sample(RECOGNITION_LABELS.filter(l=>l!==item.target.label), 3);
      const options = shuffle([item.target.label, ...distractors]);
      qs.push({
        prompt:`<span class="arabic big-ar">${item.sentence.ar}</span><br><span class="muted">${item.sentence.tr}</span><br>What role does <span class="arabic">${item.target.word}</span> play?`,
        options, correct: options.indexOf(item.target.label),
        explain: `${item.target.word} is a ${item.target.label}: ${item.target.why}. (“${item.sentence.en}”)`
      });
    } else {
      const s = pick(sentenceItems);
      const options = shuffle(['Nominal sentence','Verbal sentence']);
      const correctText = s.sentenceType==='nominal' ? 'Nominal sentence' : 'Verbal sentence';
      qs.push({
        prompt:`<span class="arabic big-ar">${s.ar}</span><br><span class="muted">${s.tr}</span><br>Is this a nominal sentence or a verbal sentence?`,
        options, correct: options.indexOf(correctText),
        explain: `${correctText}: ${s.sentenceWhy}. (“${s.en}”)`
      });
    }
  }
  return qs;
}

function buildCrosswordGrid(){
  const grid = Array.from({length:CROSSWORD.rows}, ()=>Array(CROSSWORD.cols).fill(null));
  CROSSWORD.words.forEach(w=>{
    for(let i=0;i<w.word.length;i++){
      const r = w.dir==='across' ? w.r : w.r+i;
      const c = w.dir==='across' ? w.c+i : w.c;
      grid[r][c] = grid[r][c] || { letter:w.word[i] };
    }
  });
  // assign numbers
  const numbered = {};
  CROSSWORD.words.forEach(w=>{ numbered[w.r+','+w.c] = w.num; });
  return {grid, numbered};
}
function renderCrossword(main){
  main.appendChild(mkEl(`<div><h1>Crossword</h1></div>`));
  const {grid, numbered} = buildCrosswordGrid();
  const wrap = mkEl(`<div class="xw-wrap"></div>`);
  const tableEl = document.createElement('table');
  tableEl.className='xw';
  for(let r=0;r<CROSSWORD.rows;r++){
    const tr = document.createElement('tr');
    for(let c=0;c<CROSSWORD.cols;c++){
      const td = document.createElement('td');
      if(grid[r][c]){
        const key=r+','+c;
        if(numbered[key]) td.appendChild(mkEl(`<span class="num">${numbered[key]}</span>`));
        const inp = document.createElement('input');
        inp.maxLength=1;
        inp.dataset.r=r; inp.dataset.c=c; inp.dataset.letter=grid[r][c].letter;
        inp.oninput=(e)=>{ e.target.value = e.target.value.toUpperCase().slice(-1); };
        td.appendChild(inp);
      } else {
        td.className='block';
      }
      tr.appendChild(td);
    }
    tableEl.appendChild(tr);
  }
  wrap.appendChild(tableEl);
  const clues = mkEl(`<div class="clue-list"></div>`);
  const across = CROSSWORD.words.filter(w=>w.dir==='across');
  const down = CROSSWORD.words.filter(w=>w.dir==='down');
  clues.appendChild(mkEl(`<div><h4>Across</h4><ol>${across.map(w=>`<li><b>${w.num}.</b> ${w.clue.split(': ')[1]}</li>`).join('')}</ol></div>`));
  clues.appendChild(mkEl(`<div><h4>Down</h4><ol>${down.map(w=>`<li><b>${w.num}.</b> ${w.clue.split(': ')[1]}</li>`).join('')}</ol></div>`));
  wrap.appendChild(clues);
  main.appendChild(wrap);
  const controls = mkEl(`<div class="row" style="margin-top:16px;"><button class="btn" id="xwCheck">Check</button><button class="btn ghost" id="xwReveal">Reveal</button><span id="xwMsg" class="pill"></span></div>`);
  main.appendChild(controls);
  controls.querySelector('#xwCheck').onclick=()=>{
    let correct=0, total=0;
    tableEl.querySelectorAll('input').forEach(inp=>{
      total++;
      const ok = inp.value.toUpperCase()===inp.dataset.letter;
      inp.classList.toggle('correct', ok && inp.value!=='');
      inp.classList.toggle('wrong', !ok && inp.value!=='');
      if(ok) correct++;
    });
    controls.querySelector('#xwMsg').textContent = `${correct}/${total} correct`;
  };
  controls.querySelector('#xwReveal').onclick=()=>{
    tableEl.querySelectorAll('input').forEach(inp=>{
      inp.value = inp.dataset.letter;
      inp.classList.add('correct'); inp.classList.remove('wrong');
    });
    controls.querySelector('#xwMsg').textContent = 'Revealed';
  };
}

const FINAL_EXAM = "Final Exam: Thursday, December 17, 7:00-9:00 PM. Place TBA.";

let hwState = { book:'alifbaa' };
function renderHomework(main){
  main.appendChild(mkEl(`<div><h1>Homework and Daily Assignments</h1></div>`));
  const controls = mkEl(`<div class="row" style="margin-bottom:16px;"><select id="hwBook"></select></div>`);
  main.appendChild(controls);
  const bookSel = controls.querySelector('#hwBook');
  BOOKS.forEach(b=>bookSel.appendChild(mkEl(`<option value="${b.id}">${b.label}</option>`)));
  bookSel.value = hwState.book;
  const area = mkEl(`<div id="hwArea"></div>`);
  main.appendChild(area);
  bookSel.onchange=()=>{ hwState.book=bookSel.value; draw(); };
  draw();

  function draw(){
    const areaEl = document.getElementById('hwArea');
    areaEl.innerHTML='';
    const rows = HOMEWORK.filter(h=>h.book===hwState.book);
    const weeks = [...new Set(rows.map(r=>r.week))];
    weeks.forEach(w=>{
      areaEl.appendChild(mkEl(`<h2 style="margin-top:24px;">Week ${w}</h2>`));
      rows.filter(r=>r.week===w).forEach(r=>{
        const card = mkEl(`<div class="card"></div>`);
        card.appendChild(mkEl(`<div class="row" style="margin-bottom:8px;"><span class="pill">${r.day}, ${r.date}</span><b>${r.topic}</b></div>`));
        if(r.inClass.length){
          card.appendChild(mkEl(`<h3 style="margin:10px 0 4px;">In class</h3>`));
          const ul = mkEl(`<ul style="margin:0 0 10px;"></ul>`);
          r.inClass.forEach(i=>ul.appendChild(mkEl(`<li>${i}</li>`)));
          card.appendChild(ul);
        }
        if(r.homework.length){
          card.appendChild(mkEl(`<h3 style="margin:10px 0 4px;">Homework</h3>`));
          const ul = mkEl(`<ul style="margin:0;"></ul>`);
          r.homework.forEach(i=>ul.appendChild(mkEl(`<li>${i}</li>`)));
          card.appendChild(ul);
        }
        areaEl.appendChild(card);
      });
    });
    if(hwState.book==='alkitaab'){
      areaEl.appendChild(mkEl(`<p class="muted" style="margin-top:16px;">${FINAL_EXAM}</p>`));
    }
  }
}


let conjState = { idx: 0 };
function renderConjugations(main, param){
  if(param !== undefined) conjState.idx = Number(param);
  main.appendChild(mkEl(`<div><h1>Verb Conjugations</h1></div>`));
  BOOKS.forEach(b=>{
    const bookVerbs = CONJUGATIONS.map((v,i)=>({v,i})).filter(x=>x.v.book===b.id);
    if(bookVerbs.length===0) return;
    main.appendChild(mkEl(`<h2 style="margin-top:20px;">${b.label}</h2>`));
    const picker = mkEl(`<div class="grid cols3" style="margin-bottom:20px;"></div>`);
    bookVerbs.forEach(({v,i})=>{
      const card = mkEl(`<div class="card lesson-card" style="padding:12px 16px;${i===conjState.idx?'border-color:var(--accent);':''}">
        <div class="arabic big-ar" style="text-align:center;">${v.root}</div>
        <div class="muted" style="text-align:center;">${v.english}</div>
      </div>`);
      card.onclick = ()=>go('conjugations', i);
      picker.appendChild(card);
    });
    main.appendChild(picker);
  });

  const v = CONJUGATIONS[conjState.idx];
  const bookInfo = BOOKS.find(b=>b.id===v.book);
  const card = mkEl(`<div class="card"></div>`);
  card.appendChild(mkEl(`<div class="row" style="margin-bottom:10px;"><span class="pill">${bookInfo.label}</span><span class="pill">Conjugate \u201c${v.root}\u201d with the following pronouns</span></div>`));
  card.appendChild(mkEl(`<div class="arabic big-ar" style="text-align:center;margin-bottom:4px;">${v.root}</div>`));
  card.appendChild(mkEl(`<div class="muted" style="text-align:center;margin-bottom:16px;">"${v.english}"</div>`));

  function block(title, indices){
    const t = mkEl(`<div style="margin-bottom:18px;"></div>`);
    t.appendChild(mkEl(`<h3 style="margin-top:0;">${title}</h3>`));
    const rows = indices.map(i => `<tr><td class="ar big-ar">${CONJ_PRONOUNS[i]}</td><td class="ar big-ar">${v.forms[i]}</td></tr>`).join('');
    t.appendChild(mkEl(`<table><tr><th class="ar">الضمير</th><th class="ar">المضارع</th></tr>${rows}</table>`));
    return t;
  }
  const grid = mkEl(`<div class="grid cols3"></div>`);
  grid.appendChild(block("Singular", [0,1,2,3,4]));
  grid.appendChild(block("Dual", [6,7,8]));
  grid.appendChild(block("Plural", [5,9,10,11,12]));
  card.appendChild(grid);
  if(v.note){
    card.appendChild(mkEl(`<div><h3 style="margin-top:0;">Irregularity note</h3><p class="muted">${v.note}</p></div>`));
  }
  main.appendChild(card);

  const nav = mkEl(`<div class="row" style="margin-top:16px;"></div>`);
  if(conjState.idx>0){
    const b = mkEl(`<button class="btn ghost">&larr; ${CONJUGATIONS[conjState.idx-1].english}</button>`);
    b.onclick = ()=>go('conjugations', conjState.idx-1);
    nav.appendChild(b);
  }
  nav.appendChild(mkEl(`<div class="spacer"></div>`));
  if(conjState.idx<CONJUGATIONS.length-1){
    const b = mkEl(`<button class="btn">${CONJUGATIONS[conjState.idx+1].english} &rarr;</button>`);
    b.onclick = ()=>go('conjugations', conjState.idx+1);
    nav.appendChild(b);
  }
  main.appendChild(nav);
}
